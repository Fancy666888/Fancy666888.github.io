    项目经历:
      - name: 面向精密有序装配的具身智能机械臂协同控制系统
        summary: 面向任务卡语义理解和六步精密装配，构建以 Python GUI 为中枢的视觉、规划与机械臂协同控制系统。
        highlights:
          - 以多模态模型解析任务语义，并通过确定性规则校验限制可执行结果
          - 接入 VisionMaster TCP 协议和 AUBO ARCS SDK，以状态机组织坐标转换、运动控制和日志留痕
      - name: 蓝莓成熟度检测与 RGB-D 数据采集管理系统
        summary: 面向蓝莓采摘机器人的视觉感知与数据基础设施，覆盖成熟度检测、深度采集、质量评估和数据集管理。
        highlights:
          - 使用 YOLOv8、FastAPI、OpenCV 构建未熟、半熟和成熟蓝莓检测应用
          - 支持 RealSense D435i/D405、连续采集、深度质量指标、会话报告与数据完整性审计
      - name: 投票系统的贝叶斯推断与动态评分研究
        summary: 2026 MCM/ICM Problem C 参赛论文，研究隐藏观众投票估计和评委—观众评分机制。
        highlights:
          - 采用分层约束下的贝叶斯 MCMC 推断与 Lasso 影响因素分析
          - 提出 Logistic Dynamic Weighted System，并完成多种基线机制的重构实验比较

