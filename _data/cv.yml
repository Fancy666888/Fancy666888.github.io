    科研与项目经历:
      - name: 面向精密有序装配的具身智能机械臂协同控制系统
        date: 2026
        summary: 面向任务卡语义理解和六步精密装配，构建以 Python GUI 为中枢的视觉、规划与机械臂协同控制系统。
        highlights:
          - 多模态大模型解析任务卡并输出结构化步骤，以白名单、顺序和范围等确定性规则校验可执行结果
          - 通过 TCP 触发 VisionMaster 流程，等待真实坐标报文后再进入运动阶段，保证视觉—运动时序一致
          - 完成视觉坐标到机械臂坐标的映射，经 AUBO ARCS SDK/RPC 执行 MoveJ、MoveL 等动作
          - 以状态机组织抓取、放置、复位与异常处理，保留状态、时间戳和执行日志

      - name: 蓝莓成熟度检测与 RGB-D 数据采集管理系统
        date: 2026
        summary: 面向蓝莓采摘机器人的视觉感知与数据基础设施，覆盖成熟度检测、深度采集、质量评估和数据集管理。
        highlights:
          - 训练 YOLO 模型识别未熟、半熟和成熟蓝莓，搭建检测应用，支持置信度调整、统计看板与 CSV 导出
          - 接入 Intel RealSense D435i/D405，支持单帧与连续采集、Session 元数据、数据集索引和完整性审计
          - 计算有效深度比例、中心深度和中位深度等质量指标并生成采集报告，为三维定位与算法训练积累规范化数据

      - name: 基于 OpenMV 与 STM32F407 的智能救援小车
        date: 2026-04
        summary: 面向智能救援赛项，完成颜色目标识别、全向底盘控制和夹取转运系统的软硬件联调。
        highlights:
          - 使用 OpenMV4 H7 Plus 完成颜色阈值分割、色块筛选和目标定位，识别不同类别目标并计算水平偏差
          - STM32F407 按麦克纳姆轮逆运动学解算三轴速度指令，经 TB6612 输出 PWM，以四路编码器和 PID 实现约 10 ms 周期的轮速闭环
          - 以“搜索—跟踪—接近—夹取/转运—返回”状态机组织动作与目标处理顺序

      - name: 投票系统的贝叶斯推断与动态评分研究
        date: 2026
        summary: 2026 MCM/ICM Problem C 研究项目，获 F 奖（Finalist）；相关论文已被 Axioms 接收，本人为第三作者。
        highlights:
          - 在分层约束下建立贝叶斯模型，以 Dirichlet 分布描述投票份额先验，使用 Metropolis–Hastings MCMC 推断隐藏粉丝投票
          - 比较排名制、百分比制与评委干预机制，并使用 Lasso 分析影响因素
          - 提出不确定性感知的专家—公众融合动态评分框架，在 34 个赛季、2777 条观测上开展分析，重构任务准确率达到 0.9655

    论文发表:
      - name: "Constrained Bayesian Reconstruction of Latent Public Preferences under Dynamic Elimination Rules: An Uncertainty-Aware Expert–Public Fusion Framework"
        date: 2026
        summary: Axioms，Accepted，第三作者；卷期、页码和 DOI 待正式上线后补充。

