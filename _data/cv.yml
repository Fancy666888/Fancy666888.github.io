      - bullet: "**北京市二等奖** · 全国大学生数学建模竞赛（2025.09）"
      - bullet: "**北京市三等奖** · 全国大学生电子设计竞赛（2026.08）"
      - bullet: "**校级二等奖** · 校级工程实践与创新能力竞赛·智能救援赛项（2026.04）"

